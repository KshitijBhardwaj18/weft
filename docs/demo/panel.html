<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0}
.f{width:1920px;height:1080px;background:#F4F3EC;position:relative;font-family:Figtree,sans-serif;overflow:hidden}
.top{position:absolute;left:56px;top:40px;display:flex;align-items:center;gap:12px;font:400 30px 'EB Garamond',serif;color:#1A1A1A}
.top i{font-style:normal;width:34px;height:34px;border-radius:9px;background:#034F46;color:#FFFFEB;display:grid;place-items:center;font:700 16px Figtree}
.top span{font:600 16px Figtree;color:#5F5E5A;margin-left:10px}
.url{position:absolute;right:56px;top:48px;font:600 16px 'JetBrains Mono',monospace;color:#034F46}
.panel{position:absolute;left:56px;top:120px;width:440px;height:830px;background:#034F46;border-radius:28px;padding:38px 36px;color:#FFFFEB;display:flex;flex-direction:column}
.steps{display:flex;flex-direction:column;gap:10px}
.st{display:flex;align-items:center;gap:12px;font:600 17px Figtree;color:rgba(207,230,225,.55)}
.st b{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(207,230,225,.45);display:grid;place-items:center;font:700 12px Figtree}
.st.done{color:#CFE6E1}.st.done b{background:#CFE6E1;color:#034F46;border-color:#CFE6E1}
.st.on{color:#FFD99A;font-size:19px}.st.on b{background:#FFD99A;color:#034F46;border-color:#FFD99A}
.eb{margin-top:auto;font:800 14px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#FFD99A}
.t{font:400 50px/1.04 'EB Garamond',serif;letter-spacing:-1px;margin:12px 0 18px}
.b{font:500 21px/1.5 Figtree;color:#CFE6E1}
.frame{position:absolute;left:528px;top:112px;width:1344px;height:846px;border-radius:20px;background:#FFFEF8;box-shadow:0 20px 60px rgba(26,26,26,.16)}
</style></head><body><div id="root"></div>
<script>
const STAGES=["Plan","Talk","Make","Decide","Sell","Restock","Learn"];
fetch("segs_all.json").then(r=>r.json()).then(S=>{
  document.getElementById("root").innerHTML=S.map(([t,ch,title,body],i)=>{
    const k=STAGES.indexOf(ch);
    return `<div class="f" id="p${i}"><div class="top"><i>W</i>Weft<span>the company harness for D2C brands</span></div><div class="url">weft.kshitijbhardwaj.space</div>
    <div class="panel"><div class="steps">${STAGES.map((s,j)=>`<div class="st ${j<k?"done":j===k?"on":""}"><b>${j+1}</b>${s}</div>`).join("")}</div>
    <div class="eb">${ch}</div><div class="t">${title}</div><div class="b">${body}</div></div><div class="frame"></div></div>`}).join("");
  document.body.dataset.ready=1;
});
</script></body></html>
